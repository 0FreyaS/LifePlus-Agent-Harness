[project]
name = "lifeplus-agent-harness"
version = "0.2.0"
description = "面向生活健康与出行服务的可交互、可追踪、可恢复 Agent Harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "langchain-openai>=1.0,<2",
  "mcp>=1.7,<2",
  "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
lifeplus-agent = "car_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]
music = ["qqmusic-api-python>=0.3.4"]
production = [
  "langgraph-checkpoint-postgres>=2.0,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncmy>=0.2,<1",
  "chromadb>=1.0,<2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
