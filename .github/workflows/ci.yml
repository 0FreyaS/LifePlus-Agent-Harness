name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_MODE: local
      DATABASE_PATH: /tmp/lifeplus-ci.sqlite3
      CHROMA_PATH: /tmp/lifeplus-ci-chroma
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
      - run: uv sync --frozen --extra dev --extra music
      - run: uv run --frozen --extra dev --extra music pytest -q
      - run: uv run --frozen --extra dev python scripts/prepare_release.py --output /tmp/lifeplus-release
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lifeplus-agent:ci .
